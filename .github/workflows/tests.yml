name: Tests and offline bundle

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
          - { os: windows-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q -ra

  bundle:
    name: Build and check the offline zip
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the portable zip (Python and packages inside; the only online step)
        run: python tools/build_offline_zip.py --portable "$env:pythonLocation" --out dist
      - name: Unzip it and scan the test files with only what is inside
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\bundle"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\bundle" -Directory | Select-Object -First 1
          $py = Join-Path $dir.FullName "python\python.exe"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:PYTHONHOME = ""; $env:PYTHONPATH = ""
          Push-Location $dir.FullName
          & $py -c "import sys, numpy, PIL, pillow_heif, pymupdf, send2trash, tkinter; print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw "bundled Python is missing packages" }
          & $py "$env:GITHUB_WORKSPACE\tests\make_test_files.py" "$env:RUNNER_TEMP\testset"
          & $py dupefinder.py "$env:RUNNER_TEMP\testset" --report-only --no-browser --cache "$env:RUNNER_TEMP\cache"
          if ($LASTEXITCODE -ne 0) { throw "scan with the bundled Python failed" }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: DupeFinder-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Attach the zip to a GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DupeFinder-windows
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --title "DupeFinder ${{ github.ref_name }}" --notes "Offline Windows bundle with its own Python. Unzip, then double-click run.bat."
